name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        run: |
          npm install
          npm run build
        env:
          VITE_BASE_PATH: /magic-library/

      # Demonstração (3 alunos fictícios, sem login) em /magic-library/demo/
      # Mesmo código do app, com o Firebase trocado por um banco de mentira no navegador.
      - name: Build demo
        run: npx vite build --outDir dist/demo --emptyOutDir false
        env:
          VITE_BASE_PATH: /magic-library/demo/
          VITE_DEMO: 'true'

      # Escola (demonstração com dados fictícios + painel do professor) em /magic-library/escola/
      - name: Build escola
        run: npx vite build --outDir dist/escola --emptyOutDir false
        env:
          VITE_BASE_PATH: /magic-library/escola/
          VITE_SCHOOL: 'true'

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*,package.json"
          target: /var/www/approutinetech/dist/magic-library/
          strip_components: 1

      - name: Fix permissions and install dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/approutinetech/dist/magic-library
            chmod -R 755 assets demo escola
            npm install --omit=dev
            pm2 restart magic-library || pm2 start server.cjs --name magic-library
            pm2 save